name: Build Mac DMG

# Manual only: the DMG target hits electron-builder's hdiutil bug on CI
# runners and failed on roughly half of pushes. Releases ship a zip via
# release.yml; run this by hand when you specifically want a DMG.
on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Mac DMG
        run: npm run build:mac -- --publish never

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Prism-Mac
          path: dist/*.dmg
          retention-days: 30
