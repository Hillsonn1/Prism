name: Deploy Site

on:
  push:
    branches:
      - master
    paths:
      - 'site/**'
  workflow_dispatch:

jobs:
  deploy-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep version.json in step with package.json so a site-only push can
      # never roll the advertised version back behind the latest release.
      - name: Write version.json
        run: node scripts/write-version.js

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy to Netlify
        run: netlify deploy --dir=site --prod --message "Site update from $GITHUB_SHA"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
