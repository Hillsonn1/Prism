name: Deploy Site

on:
  push:
    branches:
      - master
    paths:
      - 'site/**'
  workflow_dispatch:

jobs:
  deploy-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A site-only deploy advertises the newest *published* release, so it can
      # neither roll the version back nor announce one that isn't built yet.
      - name: Write version.json from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/write-version.js "$(gh release view --json tagName --jq .tagName)"

      # Where the hosted (browser) version lives, if one is deployed: a repository variable
      - name: Write site/config.js
        run: echo "window.PRISM_APP_URL = \"${{ vars.PRISM_APP_URL }}\";" > site/config.js

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy to Netlify
        run: netlify deploy --dir=site --prod --message "Site update from $GITHUB_SHA"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
